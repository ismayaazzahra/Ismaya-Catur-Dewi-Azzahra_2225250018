<title>BoxBuster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap">
<style>
/* Layout: satu kolom selebar HP (maks 480px), header pita lakban kardus, satu tugas per layar. */
:root{
  --bg:#FFFBF5; --surface:#FFFFFF; --surface-2:#F6EEE3; --line:#E7DCCB;
  --text:#1C1917; --muted:#57534E;
  --brand:#B45309; --brand-ink:#FFFFFF;
  --kraft:#C9A27A; --kraft-ink:#2A1D10; --kraft-line:#A8825C;
  --c-bruto:#2563EB; --c-netto:#16A34A; --c-tara:#EA580C; --c-harga:#7C3AED;
  --bruto-tint:#DCE7FD; --netto-tint:#D7F2DF; --tara-tint:#FDE3D2;
  --ok:#15803D; --ok-tint:#E3F5E8; --err:#B91C1C; --err-tint:#FCE6E6;
  --f-display:"Saira Stencil One","Arial Black",Impact,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1917; --surface:#292524; --surface-2:#332E2A; --line:#44403C;
    --text:#F5F5F4; --muted:#A8A29E;
    --brand:#F59E0B; --brand-ink:#1C1917;
    --kraft:#5C4330; --kraft-ink:#F5E6D3; --kraft-line:#7A5A3E;
    --c-bruto:#60A5FA; --c-netto:#4ADE80; --c-tara:#FB923C; --c-harga:#A78BFA;
    --bruto-tint:#1E2D4D; --netto-tint:#1F3B28; --tara-tint:#4A2E1F;
    --ok:#4ADE80; --ok-tint:#173322; --err:#F87171; --err-tint:#3D1C1C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1C1917; --surface:#292524; --surface-2:#332E2A; --line:#44403C;
  --text:#F5F5F4; --muted:#A8A29E;
  --brand:#F59E0B; --brand-ink:#1C1917;
  --kraft:#5C4330; --kraft-ink:#F5E6D3; --kraft-line:#7A5A3E;
  --c-bruto:#60A5FA; --c-netto:#4ADE80; --c-tara:#FB923C; --c-harga:#A78BFA;
  --bruto-tint:#1E2D4D; --netto-tint:#1F3B28; --tara-tint:#4A2E1F;
  --ok:#4ADE80; --ok-tint:#173322; --err:#F87171; --err-tint:#3D1C1C;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--kraft)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c-bruto);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--kraft);color:var(--kraft-ink);
  border-bottom:3px dashed var(--kraft-line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:44px}
.back{width:44px;height:44px;border-radius:50%;border:2px solid var(--kraft-ink);background:transparent;font-size:22px;line-height:1;cursor:pointer;flex:none}
.logo{font-family:var(--f-display);font-size:26px;letter-spacing:.04em;line-height:1;flex:1}
.proto{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--kraft-ink);padding:3px 8px;border-radius:4px;transform:rotate(-3deg)}

main{max-width:480px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:26px;line-height:1.2}
h2.ttl{font-family:var(--f-display);font-size:28px;font-weight:400;letter-spacing:.02em;line-height:1.1}
h3{font-size:19px}
p{margin:0}
.lead{color:var(--muted)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.num{font-variant-numeric:tabular-nums}

/* tombol */
.btn{min-height:52px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);padding:10px 18px;font-weight:700;cursor:pointer;font-size:17px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);width:100%}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 120px}

/* beranda */
.hello{display:flex;gap:14px;align-items:center}
.boxy{width:76px;height:76px;flex:none}
.bx-body{fill:var(--kraft);stroke:var(--kraft-ink);stroke-width:2.5;stroke-linejoin:round}
.bx-edge,.bx-mouth{fill:none;stroke:var(--kraft-ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bx-flap{fill:var(--kraft);stroke:var(--kraft-ink);stroke-width:2.5;stroke-linejoin:round}
.bx-eye{fill:var(--kraft-ink)}
.formula{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.formula .eq{font-size:20px;font-weight:800;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.k-bruto{color:var(--c-bruto)} .k-netto{color:var(--c-netto)} .k-tara{color:var(--c-tara)}
.mods{display:flex;flex-direction:column;gap:10px}
.mod{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;text-align:left;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;min-height:64px}
.mod:hover{border-color:var(--brand)}
.mod .n{width:40px;height:40px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;color:var(--brand)}
.mod b{display:block;font-size:17px}
.mod small{color:var(--muted);font-size:14px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.done{background:var(--ok-tint);color:var(--ok)}
.tool{border-style:dashed}
.note{font-size:14px;color:var(--muted);border-left:3px solid var(--kraft-line);padding-left:10px}

/* bongkar kotak */
.picker{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pick{flex:none;min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px}
.pick.on{border-color:var(--brand);background:var(--surface-2)}
/* panggung bongkar: meja putih tetap di kedua tema agar foto kemasan menyatu */
.stage{margin:0;background:#FFFFFF;border:2px solid var(--line);border-radius:var(--r);position:relative;height:260px;overflow:hidden;cursor:pointer}
.stage .plat{position:absolute;left:5%;right:5%;bottom:46px;height:10px;border-radius:5px;background:#E7E5E4}
.stage img{position:absolute;bottom:54px;left:50%;object-fit:contain;transition:left .55s cubic-bezier(.3,.7,.2,1),transform .55s cubic-bezier(.3,.7,.2,1),opacity .35s}
.stage .wadah{height:175px;width:50%;transform:translateX(-50%);z-index:2}
.stage .isi{height:135px;width:46%;transform:translateX(-50%) scale(.3);opacity:0;z-index:1}
.stage.open .wadah{left:26%;transform:translateX(-50%) rotate(-12deg) scale(.82)}
.stage.open .isi{left:73%;transform:translateX(-50%) scale(1);opacity:1}
.stage .lb{position:absolute;bottom:9px;transform:translateX(-50%);font-weight:800;font-size:15px;color:#1C1917;background:#FFFFFF;border:2.5px solid;border-radius:8px;padding:2px 10px;white-space:nowrap;transition:opacity .3s;font-variant-numeric:tabular-nums}
.lb.b{left:50%;border-color:#2563EB} .lb.t{left:26%;border-color:#EA580C;opacity:0} .lb.n{left:73%;border-color:#16A34A;opacity:0}
.stage.open .lb.b,.stage.open .tap-hint{opacity:0} .stage.open .lb.t,.stage.open .lb.n{opacity:1}
.tap-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;color:#57534E;background:#F5F5F4;padding:3px 10px;border-radius:999px;transition:opacity .3s;white-space:nowrap}
.boxy{object-fit:contain}
.snd{width:40px;height:40px;border-radius:50%;border:2px solid var(--kraft-ink);background:transparent;color:var(--kraft-ink);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.snd[aria-pressed="false"]{opacity:.55}
.snd[aria-pressed="false"] .on-only,.snd[aria-pressed="true"] .off-only{display:none}
.wd{fill:var(--tara-tint);stroke:var(--c-tara);stroke-width:3;stroke-linejoin:round}
.wd-mark{fill:none;stroke:var(--c-tara);stroke-width:2;stroke-dasharray:4 4}
.isi-s{fill:var(--netto-tint);stroke:var(--c-netto);stroke-width:2.5;stroke-linejoin:round}
.isi-d{fill:var(--c-netto)}
.svt{fill:var(--text);font:700 15px var(--f-body)}
.scale{fill:var(--muted)}
.g-wadah,.g-isi,.lid,.lbl{transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .3s}
.g-wadah,.g-isi{transform:translateX(50px)}
.lid{transform-box:fill-box;transform-origin:0% 100%}
.lbl-buka{opacity:0}
.stage.open .g-wadah{transform:translateX(-10px)}
.stage.open .g-isi{transform:translateX(140px)}
.stage.open .lid{transform:translate(-6px,-14px) rotate(-28deg)}
.stage.open .lbl-tutup{opacity:0}
.stage.open .lbl-buka{opacity:1}
.anchors{display:grid;gap:6px;background:var(--surface-2);border-radius:var(--r);padding:12px 14px;font-weight:700}

/* bar model */
.bm{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--surface-2);gap:3px}
.seg{height:100%;transition:width .45s cubic-bezier(.3,.7,.2,1);border-radius:4px}
.s-bruto{background:var(--c-bruto)} .s-netto{background:var(--c-netto)}
.s-tara{background:repeating-linear-gradient(135deg,var(--c-tara) 0 6px,color-mix(in srgb,var(--c-tara) 70%,var(--surface)) 6px 10px);background-color:var(--c-tara)}
.bar.empty{border:2px dashed var(--line);background:transparent;justify-content:center;align-items:center;color:var(--muted);font-weight:800}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.legend li{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;color:var(--muted);display:flex;flex-direction:column}
.legend b{color:var(--text);font-size:16px;font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:baseline}
.sw.bruto{background:var(--c-bruto)} .sw.netto{background:var(--c-netto)} .sw.tara{background:var(--c-tara)}
.cap{font-size:13px;color:var(--muted)}

/* kartu umum */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.c-bruto{border-color:var(--c-bruto)} .card.c-netto{border-color:var(--c-netto)} .card.c-tara{border-color:var(--c-tara)}
.anchor{font-size:20px;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:14px;padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.label-mock{align-self:flex-start;border:2px solid var(--text);border-radius:4px;padding:6px 10px;font-family:ui-monospace,Consolas,monospace;font-size:14px;line-height:1.3;background:var(--surface)}
table.units{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.units td{padding:8px 4px;border-bottom:1px solid var(--line)}
.units td:last-child{text-align:right;font-weight:700}

/* soal */
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.cur{background:var(--brand)}
.qtext{font-size:19px;line-height:1.6}
.chip{border:none;border-bottom:3px solid;background:transparent;padding:0 2px;font-weight:700;cursor:pointer;font-size:inherit}
.chip.bruto{border-color:var(--c-bruto);background:var(--bruto-tint)}
.chip.netto{border-color:var(--c-netto);background:var(--netto-tint)}
.chip.tara{border-color:var(--c-tara);background:var(--tara-tint)}
.pop{font-size:15px;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:56px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:18px;cursor:pointer;font-variant-numeric:tabular-nums}
.opt.sel{border-color:var(--brand);background:var(--surface-2)}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.inp{display:flex;align-items:center;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.inp:focus-within{border-color:var(--brand)}
.inp input{flex:1;min-width:0;border:none;background:transparent;font:800 20px var(--f-body);color:var(--text);padding:12px 14px;font-variant-numeric:tabular-nums}
.inp input:focus{outline:none}
.inp .u{padding:0 14px;color:var(--muted);font-weight:700}
.fb{border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--ok-tint)} .fb.err{background:var(--err-tint)}
.fb .h{font-weight:800;font-size:18px}
.fb.ok .h{color:var(--ok)} .fb.err .h{color:var(--err)}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}

/* contoh bertahap */
.stepbar{display:flex;gap:6px}
.stepbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stepbar i.on{background:var(--brand)}
.big{font-size:21px;font-weight:700;line-height:1.45}
.calc{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:8px;padding:10px 12px}

/* misi */
.mstep{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:11px;text-align:center;color:var(--muted);font-weight:700}
.mstep span{border-top:5px solid var(--line);padding-top:4px}
.mstep span.on{border-color:var(--brand);color:var(--text)}
.mstep span.done{border-color:var(--ok)}
.story{font-size:18px;line-height:1.9}
.ntag{border:2px dashed var(--muted);background:var(--surface);border-radius:6px;padding:0 6px;font-weight:800;cursor:pointer;font-size:inherit;font-variant-numeric:tabular-nums}
.ntag.act{border-style:solid;border-color:var(--brand)}
.ntag small{display:block;font-size:11px;line-height:1.2;font-weight:700;color:var(--muted)}
.ntag.r-bruto{border:2px solid var(--c-bruto);background:var(--bruto-tint)}
.ntag.r-netto{border:2px solid var(--c-netto);background:var(--netto-tint)}
.ntag.r-tara,.ntag.r-persen{border:2px solid var(--c-tara);background:var(--tara-tint)}
.ntag.r-harga,.ntag.r-uang{border:2px solid var(--c-harga)}
.ntag.r-jumlah{border:2px solid var(--muted)}
.roles{display:flex;flex-wrap:wrap;gap:8px}
.roles .pick{font-size:14px}
.choice{display:flex;flex-direction:column;gap:8px}
.choice .opt{text-align:left;font-size:16px;font-weight:600;padding:12px 14px}
.chk{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer}
.chk input{width:24px;height:24px;flex:none;margin:2px 0 0;accent-color:var(--ok)}
.order{display:flex;flex-direction:column;gap:8px;min-height:40px}
.frag{text-align:left;padding:12px 14px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px}
.frag.placed{border-color:var(--c-netto)}
.share{background:var(--surface);border:3px solid var(--kraft-line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.share .logo{font-size:20px;color:var(--brand)}

/* alat hitung */
.seg-toggle{display:flex;border:2px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg-toggle button{flex:1;min-height:44px;border:none;background:var(--surface);font-weight:700;cursor:pointer}
.seg-toggle button.on{background:var(--c-tara);color:#fff}
.err-txt{color:var(--err);font-weight:700}

/* peta petualangan (dunia ilustrasi: warna tetap di kedua tema) */
.quest{display:flex;gap:10px;align-items:flex-start}
.quest .boxy{width:64px;height:64px;margin-top:6px}
.speech{position:relative;flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.speech::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.task{font-size:15px;color:var(--muted)}
.map{position:relative;border-radius:18px;overflow:hidden;background:#0B3B47;line-height:0;border:3px solid #3B2412}
.map svg{display:block;width:100%;height:auto}
.wave{animation:wave 3.6s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(7px)}}
.bob{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.shine{animation:shine 2.4s ease-in-out infinite alternate;transform-origin:180px 96px}
@keyframes shine{to{opacity:.55;transform:scale(1.12)}}
.hud{position:absolute;top:10px;left:10px;right:10px;z-index:2;display:flex;justify-content:space-between;gap:8px;line-height:1.2}
.hud span{background:rgba(6,33,40,.82);color:#FCD34D;font-weight:800;font-size:14px;padding:6px 11px;border-radius:999px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.node{position:absolute;transform:translate(-50%,-50%);line-height:1.2;z-index:1}
.dot{width:46px;height:46px;border-radius:50%;border:3px solid #3B2412;display:grid;place-items:center;font:400 20px var(--f-display);cursor:pointer;box-shadow:0 4px 0 #3B2412;padding:0}
.dot.done{background:#FCD34D;color:#3B2412;font:900 22px var(--f-body)}
.dot.cur{background:#F59E0B;color:#3B2412;animation:pulse 1.6s ease-out infinite}
.dot.lock{background:#A8A29E;color:#44403C}
.dot.tool{width:38px;height:38px;background:#7DD3DC;color:#0B3B47;font-size:18px}
.dot:active{transform:translateY(3px);box-shadow:0 1px 0 #3B2412}
@keyframes pulse{0%{box-shadow:0 4px 0 #3B2412,0 0 0 0 rgba(252,211,77,.85)}75%{box-shadow:0 4px 0 #3B2412,0 0 0 16px rgba(252,211,77,0)}100%{box-shadow:0 4px 0 #3B2412,0 0 0 0 rgba(252,211,77,0)}}
.plank{position:absolute;top:50%;transform:translateY(-50%);background:#7A4A23;color:#FFF4E0;border:2px solid #3B2412;border-radius:6px;padding:4px 7px;font-size:12px;font-weight:800;width:max-content;max-width:84px;text-align:center;pointer-events:none;box-shadow:0 2px 0 #3B2412}
.plank small{display:block;font-weight:600;color:#F5D9B0;font-size:10.5px}
.plank.dim{background:#57534E;color:#E7E5E4}
.plank.dim small{color:#D6D3D1}
.tool-plank{background:#0F5866}
.node.side-l .plank{right:calc(100% + 6px)}
.node.side-r .plank{left:calc(100% + 6px)}
.go-tag{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#FCD34D;color:#3B2412;font-weight:900;font-size:12px;padding:2px 8px;border-radius:6px;border:2px solid #3B2412;white-space:nowrap}
.goal-hit{position:absolute;transform:translate(-50%,-50%);width:24%;aspect-ratio:1;background:transparent;border:0;border-radius:12px;cursor:pointer;z-index:1}
.node-start{position:absolute;transform:translate(-50%,-50%);font:400 13px var(--f-display);letter-spacing:.08em;color:#FFF4E0;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:#1C1917;color:#FCD34D;border:2px solid #FCD34D;font-weight:700;padding:12px 16px;border-radius:12px;max-width:calc(100% - 32px);width:max-content;text-align:center}
.reward{border-color:#F59E0B}

/* masuk / daftar */
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-block:4px}
.hero-boxy{width:150px;height:auto;animation:bob 1.1s ease-in-out infinite alternate}
.wtitle{font-family:var(--f-display);font-weight:400;font-size:42px;letter-spacing:.04em;color:var(--brand);line-height:1}
.seg-toggle.tabs button{font-size:16px;min-height:48px}
.seg-toggle.tabs button.on{background:var(--brand);color:var(--brand-ink)}
.players{display:flex;flex-direction:column;gap:10px}
.player{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer;min-height:72px}
.player.last{border-color:var(--brand)}
.player img{width:52px;height:52px;object-fit:contain;background:#FFFFFF;border-radius:10px}
.player b{display:block;font-size:18px;overflow-wrap:anywhere}
.player small{display:block;color:var(--muted);font-size:14px}
.player .go{font-weight:800;color:var(--brand)}
.ava{border:0;margin:0;padding:0;min-width:0}
.ava legend{font-weight:700;font-size:15px;margin-bottom:8px;padding:0}
.ava-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ava-btn{background:#FFFFFF;border:3px solid var(--line);border-radius:12px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:#1C1917;min-height:84px}
.ava-btn img{height:54px;width:100%;object-fit:contain}
.ava-btn[aria-pressed="true"]{border-color:var(--brand);background:#FEF3C7}
.pbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:8px 10px}
.pbar img{width:42px;height:42px;object-fit:contain;background:#FFFFFF;border-radius:8px;flex:none}
.pbar span{flex:1;min-width:0;overflow-wrap:anywhere}
.pbar small{display:block;color:var(--muted);font-size:13px}
.btn.sm{min-height:44px;padding:6px 12px;font-size:14px}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
</style>

if(store.music===undefined) store.music = true;

let AC=null, master, musicGain, sfxGain, noiseBuf, musicTimer=null, nextT=0, stepI=0;
function ensureAC(){
  if(!AC){
    const C = window.AudioContext || window.webkitAudioContext; if(!C) return null;
    try{ AC = new C(); }catch(e){ return null; }
    master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0; musicGain.connect(master);
    sfxGain = AC.createGain(); sfxGain.gain.value = .6; sfxGain.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate*.2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
const mf = m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,dur,type,vol,dest,slide){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+.03);
}
function noise(t,dur,vol,dest,hp){
  const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=noiseBuf; f.type='highpass'; f.frequency.value=hp||7000;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t+dur+.02);
}
// lagu petualangan ceria: 8 birama, C - Am - F - G - C - F - Am - G
const _ = 0;
const MEL = [72,76,79,76,81,79,76,74, 72,74,76,79,76,74,72,_, 69,72,74,76,79,76,74,72, 74,76,74,72,69,_,67,_,
             72,76,79,81,84,81,79,76, 77,76,74,76,79,_,76,_, 81,79,76,74,72,74,76,79, 74,_,76,74,72,_,_,_];
const BASS = [48,45,41,43,48,41,45,43];
const EIGHTH = 60/132/2;
function playStep(i,t){
  const m = MEL[i]; if(m) tone(mf(m),t,EIGHTH*.85,'square',.045,musicGain);
  const r = BASS[Math.floor(i/8)]; tone(mf(i%2 ? r+12 : r),t,EIGHTH*.8,'triangle',.11,musicGain);
  if(i%4===0) tone(140,t,.13,'sine',.22,musicGain,45);
  if(i%2===1) noise(t,.04,.05,musicGain);
  if(i%8===4) noise(t,.09,.07,musicGain,2500);
}
function schedule(){ while(nextT < AC.currentTime+.25){ playStep(stepI,nextT); nextT += EIGHTH; stepI = (stepI+1) % MEL.length; } }
function startMusic(){
  if(!store.music || (screen!=='home' && screen!=='masuk') || !AC || musicTimer) return;
  ensureAC();
  musicGain.gain.cancelScheduledValues(AC.currentTime);
  musicGain.gain.setValueAtTime(musicGain.gain.value, AC.currentTime);
  musicGain.gain.linearRampToValueAtTime(.55, AC.currentTime+.6);
  nextT = AC.currentTime+.08; musicTimer = setInterval(schedule, 40);
}
function stopMusic(){
  if(!musicTimer) return;
  clearInterval(musicTimer); musicTimer = null;
  musicGain.gain.cancelScheduledValues(AC.currentTime);
  musicGain.gain.setValueAtTime(musicGain.gain.value, AC.currentTime);
  musicGain.gain.linearRampToValueAtTime(0, AC.currentTime+.35);
}
function sfx(name){
  if(!store.sfx || !ensureAC()) return;
  const t = AC.currentTime+.005;
  if(name==='click'){ tone(880,t,.06,'square',.08,sfxGain,1500); }
  else if(name==='ok'){ [1046,1318,1568,2093].forEach((f,i)=>tone(f,t+i*.07,.16,'triangle',.16,sfxGain)); }
  else if(name==='err'){ tone(300,t,.24,'sawtooth',.07,sfxGain,140); }
  else if(name==='open'){ noise(t,.25,.12,sfxGain,1200); tone(400,t+.05,.2,'triangle',.14,sfxGain,1200); tone(1568,t+.25,.15,'square',.05,sfxGain); }
  else if(name==='close'){ tone(900,t,.15,'triangle',.1,sfxGain,300); }
  else if(name==='unlock'){ [784,988,1175,1568,1976].forEach((f,i)=>tone(f,t+i*.09,.22,'square',.06,sfxGain)); noise(t+.45,.4,.05,sfxGain,6000); }
}

/* ---------- util ---------- */
function fmt(v){ return Number(Number(v).toFixed(2)).toLocaleString('id-ID',{maximumFractionDigits:2}); }
function fmtU(v,u){ return u==='rp' ? 'Rp' + fmt(v) : (u==='%' ? fmt(v)+'%' : fmt(v)+' '+u); }
function parseAngka(s){
  if(s==null) return null;
  s = String(s).replace(/rp|\s/gi,'');
  if(s==='') return null;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,'');
  s = s.replace(',','.');
  const v = Number(s);
  return isNaN(v) ? null : v;
}

/* bar model: o = {b,n,t, lb,ln,lt, split, cap} */
function barHTML(o){
  const ratio = o.b>0 ? o.t/o.b*100 : 0;
  const vt = Math.max(ratio, 8), vn = 100 - vt;
  const bottom = o.split
    ? '<div class="bar"><div class="seg s-netto" style="width:'+vn+'%"></div><div class="seg s-tara" style="width:'+vt+'%"></div></div>'
    : '<div class="bar empty">? + ?</div>';
  const note = (o.split && ratio < 8) ? '<p class="cap">Batang tara diperlebar agar terlihat.</p>' : '';
  return '<div class="bm" role="img" aria-label="Bar model: bruto '+esc(o.lb)+', netto '+esc(o.ln)+', tara '+esc(o.lt)+'">'+
    '<div class="bar"><div class="seg s-bruto" style="width:100%"></div></div>'+ bottom +
    '<ul class="legend">'+
      '<li><span><i class="sw bruto"></i>Bruto</span><b>'+esc(o.lb)+'</b></li>'+
      '<li><span><i class="sw netto"></i>Netto</span><b>'+esc(o.ln)+'</b></li>'+
      '<li><span><i class="sw tara"></i>Tara</span><b>'+esc(o.lt)+'</b></li>'+
    '</ul>'+ note + (o.cap ? '<p class="cap">'+o.cap+'</p>' : '') +'</div>';
}

const PTS = [[180,1010],[125,880],[235,720],[125,560],[235,400],[125,240],[180,140]];
function segD(i){ const a=PTS[i], b=PTS[i+1], my=(a[1]+b[1])/2; return ' C '+a[0]+' '+my+', '+b[0]+' '+my+', '+b[0]+' '+b[1]; }
function trailD(n){ let d='M '+PTS[0][0]+' '+PTS[0][1]; for(let i=0;i<n;i++) d+=segD(i); return d; }
function rnd(i){ const x=Math.sin(i*12.9898+4.1)*43758.5453; return x-Math.floor(x); }
function blob(cx,cy,rx,ry,seed){
  const n=11, p=[];
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, r=1+0.11*Math.sin(seed*3.1+i*1.7)+0.07*Math.cos(seed*1.3+i*2.9); p.push([cx+Math.cos(a)*rx*r, cy+Math.sin(a)*ry*r]); }
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  let m=mid(p[n-1],p[0]), d='M'+m[0].toFixed(1)+' '+m[1].toFixed(1);
  for(let i=0;i<n;i++){ const q=p[i], m2=mid(q,p[(i+1)%n]); d+=' Q'+q[0].toFixed(1)+' '+q[1].toFixed(1)+' '+m2[0].toFixed(1)+' '+m2[1].toFixed(1); }
  return d+'Z';
}
function island(c,rx,ry,top,side,seed){
  const d=blob(c[0],c[1],rx,ry,seed);
  return '<path d="'+d+'" transform="translate(0 24)" fill="none" stroke="#9FE3E8" stroke-opacity=".28" stroke-width="12"/>'+
    '<path d="'+d+'" transform="translate(0 18)" fill="'+side+'"/>'+
    '<path d="'+d+'" fill="'+top+'"/>'+
    '<path d="'+blob(c[0],c[1]-4,rx*.82,ry*.7,seed+.5)+'" fill="#FFFFFF" fill-opacity=".12"/>';
}
function cube(x,gy,s,t,l,r){
  const w=s, h=s/2, H=s, y=gy-h-H;
  return '<path d="M'+x+' '+(y-h)+' L'+(x+w)+' '+y+' L'+x+' '+(y+h)+' L'+(x-w)+' '+y+'Z" fill="'+t+'" stroke="#3B2412" stroke-width="1.2" stroke-linejoin="round"/>'+
    '<path d="M'+(x-w)+' '+y+' L'+x+' '+(y+h)+' L'+x+' '+(y+h+H)+' L'+(x-w)+' '+(y+H)+'Z" fill="'+l+'" stroke="#3B2412" stroke-width="1.2" stroke-linejoin="round"/>'+
    '<path d="M'+(x+w)+' '+y+' L'+x+' '+(y+h)+' L'+x+' '+(y+h+H)+' L'+(x+w)+' '+(y+H)+'Z" fill="'+r+'" stroke="#3B2412" stroke-width="1.2" stroke-linejoin="round"/>';

screens.home = function(){
  const dn = doneCount(), all = dn>=STEPS.length;
  const cur = STEPS[dn];
  const koin = dn*20 + nBenar()*10;
  const pct = (x,y)=>'left:'+(x/MAP_W*100)+'%;top:'+(y/MAP_H*100)+'%';
  let nodes = '';
  STEPS.forEach((st,i)=>{
    const p = PTS[i+1], side = p[0]<180 ? 'side-l' : 'side-r';
    const state = i<dn ? 'done' : (i===dn ? 'cur' : 'lock');
    const inner = state==='done' ? '&#10003;' : (state==='lock' ? LOCK_ICON : String(i+1));
    const lbl = st.nama+(state==='done'?', selesai':state==='lock'?', terkunci':', tahap sekarang');
    nodes += '<div class="node '+side+'" style="'+pct(p[0],p[1])+'">'+
      (state==='cur' ? '<span class="go-tag">Ayo!</span>' : '')+
      '<button class="dot '+state+'" data-step="'+i+'" aria-label="'+lbl+'">'+inner+'</button>'+
      '<span class="plank'+(state==='lock'?' dim':'')+'">'+st.nama+'<small>'+st.modul+'</small></span></div>';
  });
  nodes += '<div class="node side-l" style="'+pct(306,640)+'"><button class="dot tool" data-go="alat" aria-label="Timbangan Ajaib, Alat Hitung">=</button><span class="plank tool-plank">Timbangan Ajaib<small>Alat Hitung</small></span></div>';
  nodes += '<button class="goal-hit" style="'+pct(180,100)+'" data-goal aria-label="Kotak Misteri'+(all?', sudah terbuka':', terkunci')+'"></button>';
  nodes += '<span class="node-start" style="'+pct(180,1036)+'">MULAI</span>';

  const msg = all
    ? 'Kotak Misteri terbuka! Kamu resmi jadi <b>Pembongkar Ahli</b>.'
    : (dn===0
      ? 'Halo, '+esc(me.nama)+'! Ayo kita menjelajah! Ikuti jalan kayu untuk membuka <b>Kotak Misteri</b> di puncak.'
      : 'Hebat, '+esc(me.nama)+'! Jalan ke <b>'+cur.nama+'</b> sudah terbuka.');
  app.innerHTML =
    '<div class="pbar"><img src="'+IMG[me.avatar||AVA[0][0]]+'" alt=""><span><b>'+esc(me.nama)+'</b>'+(me.kelas?'<small>Kelas '+esc(me.kelas)+'</small>':'')+'</span><button class="btn ghost sm" id="logout">Ganti pemain</button></div>'+
    '<section class="quest">'+boxy()+'<div class="speech"><p class="eyebrow">Petualangan BoxBuster</p><p>'+msg+'</p>'+
      (all ? '' : '<p class="task"><span class="pill">Tahap '+(dn+1)+' dari 5</span> '+cur.tugas+'</p><button class="btn primary" data-step="'+dn+'">Jelajahi '+cur.nama+'</button>')+
    '</div></section>'+
    '<div class="map" id="map"><div class="hud"><span><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FCD34D" stroke="#B45309" stroke-width="2"/></svg>'+koin+' koin</span><span>'+dn+' / 5 pulau</span></div>'+
      mapSVG(all)+nodes+'</div>'+
    (all ? '<div class="card reward"><p class="eyebrow">Isi Kotak Misteri</p><h3>Lencana Pembongkar Ahli</h3><p>Kamu sudah bisa membedakan bruto, netto, dan tara, termasuk persen tara.</p><p class="cap">Versi lengkap: lanjut ke Uji Pemahaman dan rapor.</p></div>' : '')+
    '<div class="row" id="resetRow"><button class="btn ghost" id="reset">Ulangi petualangan</button></div>'+
    '<p class="note">Ini prototipe tampilan. Versi jadi bisa dipasang di HP tanpa Play Store dan dipakai offline.</p>';

  app.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{
    const i = +b.dataset.step;
    if(i>dn){ sfx('err'); return toast('Selesaikan '+STEPS[dn].nama+' dulu, ya.'); }
    go(STEPS[i].id);
  }));
  app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  app.querySelector('[data-goal]').addEventListener('click',()=>{
    toast(all ? 'Kotak Misteri sudah terbuka. Selamat!' : 'Kotak Misteri terkunci. Selesaikan kelima pulau dulu.');
  });
  app.querySelector('#reset').addEventListener('click',()=>{
    const row = app.querySelector('#resetRow');
    row.innerHTML = '<p style="flex-basis:100%">Hapus semua progres dan mulai dari Pulau Jajanan?</p><button class="btn ghost" id="no">Batal</button><button class="btn primary" id="yes" style="width:auto">Ya, ulangi</button>';
    row.querySelector('#no').onclick = ()=>render();
    row.querySelector('#yes').onclick = ()=>{ store = Object.assign(freshStore(), {music:store.music, sfx:store.sfx}); lxIdx=0; save(); render(); };
  });
  app.querySelector('#logout').addEventListener('click',()=>{ me = null; store = freshStore(); syncSnd(); go('masuk'); });

  // gerakkan jalur & Boxy
  const svg = app.querySelector('#map > svg'), prog = svg.querySelector('#prog'), fullP = svg.querySelector('#full'), hero = svg.querySelector('#hero');
  const lenTo = k=>{ if(k===0) return 0; const t=document.createElementNS('http://www.w3.org/2000/svg','path'); t.setAttribute('d',trailD(k)); svg.appendChild(t); const L=t.getTotalLength(); t.remove(); return L; };
  const total = fullP.getTotalLength();
  const target = lenTo(Math.min(dn+1,6));
  let seen = typeof store.seen==='number' ? Math.min(store.seen,dn) : dn;
  const from = lenTo(Math.min(seen+1,6));
  prog.style.strokeDasharray = total+' '+total;
  const setAt = L=>{ prog.style.strokeDashoffset = total-L; const p=fullP.getPointAtLength(L); const dx = Math.max(-36, Math.min(36, (180-p.x)/55*36)); hero.setAttribute('transform','translate('+(p.x+dx).toFixed(1)+' '+(p.y+6).toFixed(1)+')'); };
  const focusNode = ()=>{ const el = app.querySelector('.dot.cur') || app.querySelector('.goal-hit'); if(el) el.scrollIntoView({block:'center'}); };
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(from<target && !reduce){
    setAt(from); focusNode();
    const t0 = performance.now(), dur = 1800;
    const stepF = now=>{
      if(!document.body.contains(svg)) return;
      const k = Math.min(1,(now-t0)/dur), e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
      setAt(from+(target-from)*e);
      if(k<1) requestAnimationFrame(stepF);
      else toast(all ? 'Kotak Misteri terbuka!' : 'Jalan baru terbuka: '+cur.nama+'!');
    };
    setTimeout(()=>{ sfx('unlock'); requestAnimationFrame(stepF); }, 350);
  } else { setAt(target); focusNode(); }
  store.seen = dn; save();
};

        '<div class="row"><button class="btn ghost" id="prev"'+(i===0?' disabled':'')+'>Kembali</button><button class="btn ghost" id="rep">Ulangi</button></div>'+
        '<button class="btn primary" id="next">'+(i===S.length-1?'Sekarang kamu coba':'Lanjut')+'</button>';
      app.querySelector('#prev').onclick = ()=>{ i--; draw(); };

    (q.tipe==='pilgan'
      ? '<div class="opts">'+q.opsi.map(v=>'<button class="opt" data-v="'+v+'">'+fmtU(v,q.u)+'</button>').join('')+'</div>'
      : '<div class="field"><label for="ans">Jawabanmu</label><div class="inp"><input id="ans" inputmode="decimal" autocomplete="off" placeholder="contoh: 2,5"><span class="u">'+q.u+'</span></div></div>')+
    '<div class="row"><button class="btn ghost" id="hint">Petunjuk</button><button class="btn primary" id="cek">Periksa</button></div>'+
    '<div id="fb"></div>';
  wireChips(app.querySelector('#qt'), app.querySelector('#pop'));
  app.querySelectorAll('.opt').forEach(o=>o.addEventListener('click',()=>{
    if(solved) return;
    app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); sel = Number(o.dataset.v);
  }));
  const fb = app.querySelector('#fb');
  app.querySelector('#hint').onclick = ()=>{ const p = app.querySelector('#pop'); p.hidden=false; p.textContent = 'Petunjuk: '+q.hint; };
  const cekBtn = app.querySelector('#cek');
  cekBtn.onclick = ()=>{
    if(solved){ lxIdx = (lxIdx+1) % SOAL.length; render(); window.scrollTo(0,0); return; }
    const v = q.tipe==='pilgan' ? sel : parseAngka(app.querySelector('#ans').value);
    if(v===null){ fb.innerHTML = '<div class="fb err"><p>Isi atau pilih jawaban dulu, ya.</p></div>'; return; }
    const b = q.bar;
    const barOK = barHTML({b:b.b,n:b.n,t:b.t,lb:fmtU(b.b,b.u),ln:fmtU(b.n,b.u),lt:fmtU(b.t,b.u),split:true});
    if(same(v,q.jawab)){
      solved = true; store.latihan[q.id] = true; save(); sfx('ok');
      app.querySelectorAll('.opt').forEach(o=>{ if(same(Number(o.dataset.v),q.jawab)) o.classList.add('right'); });
      fb.innerHTML = '<div class="fb ok"><p class="h">Tepat! '+fmtU(q.jawab,q.u)+'</p>'+barOK+'<ol class="steps">'+q.langkah.map(l=>'<li>'+l+'</li>').join('')+'</ol></div>'+
        (nBenar()>=4 ? '<p class="cap">Kamu sudah benar '+nBenar()+' soal. Gudang Kaleng selesai!</p>'+MAPBTN('Lihat peta: jalan baru terbuka') : '');
      cekBtn.textContent = 'Soal berikutnya';
    } else {
      tries++; sfx('err');
      const hit = q.pc.find(p=>same(p[0],v));
      const msg = hit ? MIS[hit[1]] : 'Belum tepat. '+q.hint;
      let html = '<div class="fb err"><p class="h">Belum tepat</p><p>'+esc(msg)+'</p>';
      if(tries>=2){
        html += '<p>Jawaban yang benar: <b>'+fmtU(q.jawab,q.u)+'</b></p>'+barOK+'<ol class="steps">'+q.langkah.map(l=>'<li>'+l+'</li>').join('')+'</ol>';
      } else html += '<p>Coba lagi, ya.</p>';
      fb.innerHTML = html+'</div>';
    }
  };
};

/* MISI LITERASI */
const NUMS = [
  {id:'a', txt:'2', role:'jumlah'},
  {id:'b', txt:'50 kg', role:'bruto'},
  {id:'c', txt:'2%', role:'persen'},
  {id:'d', txt:'Rp12.000', role:'harga'},
  {id:'e', txt:'Rp1.200.000', role:'uang'}
];
const ROLES = [['bruto','Bruto'],['netto','Netto'],['tara','Tara'],['persen','% Tara'],['harga','Harga per kg'],['jumlah','Banyak karung'],['uang','Uang dibawa']];
const STEPN = ['Pahami','Rencana','Hitung','Cek','Tafsir'];
screens.misi = function(){
  let st = 0, lab = {}, act = 'a', order = [];
  const story = ()=>'Bu Sari membeli '+tag('a')+' karung beras. Setiap karung tertulis '+tag('b')+'. Toko memotong berat karung '+tag('c')+' dari bruto. Harga beras '+tag('d')+' per kg. Bu Sari membawa uang '+tag('e')+'.';
  function tag(id){
    const n = NUMS.find(x=>x.id===id), r = lab[id];
    const rl = r ? ROLES.find(x=>x[0]===r)[1] : '';
    return '<button type="button" class="ntag'+(r?' r-'+r:'')+(st===0&&act===id?' act':'')+'" data-n="'+id+'">'+n.txt+(r?'<small>'+rl+'</small>':'')+'</button>';
  }
  function head(){
    return '<h2 class="ttl">Misi: Beras Bu Sari</h2><div class="mstep">'+STEPN.map((s,j)=>'<span class="'+(j===st?'on':(j<st?'done':''))+'">'+s+'</span>').join('')+'</div>';
  }
  function draw(){
    let body = '';
    if(st===0){
      body = '<p class="lead">Ketuk sebuah angka, lalu pilih artinya.</p><p class="story">'+story()+'</p>'+
        '<div class="roles">'+ROLES.map(r=>'<button class="pick" data-r="'+r[0]+'">'+r[1]+'</button>').join('')+'</div>'+
        '<button class="btn primary" id="go">Periksa label</button><div id="fb"></div>';
    } else if(st===1){
      body = '<p class="story">'+story()+'</p><h3>Apa rencanamu?</h3><div class="choice">'+
        ['Kalikan bruto 100 kg dengan harga.','Kurangi 2% langsung dari 50 kg, jadi 48 kg.','Hitung tara, lalu netto, lalu harganya.'].map((t,j)=>'<button class="opt" data-c="'+j+'">'+t+'</button>').join('')+'</div><div id="fb"></div>';
    } else if(st===2){
      body = '<p class="story">'+story()+'</p><p class="calc">Tara 1 karung = 2% × 50 kg = 1 kg</p>'+
        '<div class="field"><label for="m-n">Netto 2 karung</label><div class="inp"><input id="m-n" inputmode="decimal" autocomplete="off"><span class="u">kg</span></div></div>'+
        '<div class="field"><label for="m-u">Uang yang dibayar</label><div class="inp"><span class="u">Rp</span><input id="m-u" inputmode="numeric" autocomplete="off"></div></div>'+
        '<button class="btn primary" id="go">Periksa</button><div id="fb"></div>';
    } else if(st===3){
      body = '<p class="lead">Centang kalau pernyataannya benar.</p><div class="choice">'+
        ['Netto (98 kg) lebih kecil dari bruto (100 kg).','Semua berat sudah dalam kg.','Uang dibayar lebih kecil dari uang Bu Sari.'].map((t,j)=>'<label class="chk" for="ck'+j+'"><input type="checkbox" id="ck'+j+'"><span>'+t+'</span></label>').join('')+
        '</div><button class="btn primary" id="go">Semua wajar</button><div id="fb"></div>';
    } else if(st===4){
      body = '<p class="calc">Bayar Rp1.176.000 &middot; Uang Rp1.200.000</p><h3>Apa kesimpulannya?</h3><div class="choice">'+
        ['Uang Bu Sari kurang Rp24.000.','Uang Bu Sari pas, tidak bersisa.','Uang Bu Sari cukup dan bersisa Rp24.000.'].map((t,j)=>'<button class="opt" data-c="'+j+'">'+t+'</button>').join('')+'</div><div id="fb"></div>';
    } else {
      const F = ['Pertama, aku hitung tara dari bruto.','Lalu, netto = bruto − tara.','Terakhir, netto dikali harga per kg.'];
      const shuffled = [2,0,1];
      body = '<h3>Jelaskan ke Teman</h3><p class="lead">Ketuk kalimat sesuai urutan cara kerjamu.</p>'+
        '<div class="order">'+order.map(j=>'<div class="frag placed">'+F[j]+'</div>').join('')+'</div>'+
        '<div class="choice">'+shuffled.filter(j=>!order.includes(j)).map(j=>'<button class="frag" data-f="'+j+'">'+F[j]+'</button>').join('')+'</div>'+
        (order.length===3 ? (order.join()==='0,1,2'
          ? '<div class="share"><span class="logo">BOXBUSTER</span><b>Cara menghitung harga beras bertara</b><ol class="steps">'+F.map(f=>'<li>'+f+'</li>').join('')+'</ol><p class="cap">Misi Beras Bu Sari selesai.</p></div>'+MAPBTN('Lihat peta: buka Kotak Misteri!')
          : '<div class="fb err"><p>Urutannya belum pas. Tara dihitung paling awal.</p></div><button class="btn ghost" id="reset">Susun ulang</button>') : '');
    }
    app.innerHTML = head()+body;
    const fb = app.querySelector('#fb');
    const fail = m=>{ sfx('err'); fb.innerHTML = '<div class="fb err"><p class="h">Belum tepat</p><p>'+esc(m)+'</p></div>'; };
    const next = ()=>{ sfx('ok'); st++; draw(); window.scrollTo(0,0); };
    if(st===0){
      app.querySelectorAll('.ntag').forEach(t=>t.onclick=()=>{ act=t.dataset.n; draw(); });
      app.querySelectorAll('[data-r]').forEach(r=>r.onclick=()=>{
        lab[act]=r.dataset.r;
        const nx = NUMS.find(n=>!lab[n.id]); if(nx) act = nx.id;
        draw();
      });
      app.querySelector('#go').onclick=()=>{
        const wrong = NUMS.filter(n=>lab[n.id]!==n.role);
        if(!wrong.length) return next();
        const w = wrong[0];
        if(!lab[w.id]) return fail('Masih ada angka yang belum diberi label.');
        if(w.id==='b' && lab.b==='netto') return fail('"Tertulis 50 kg" adalah berat karung utuh. Itu bruto.');
        if(w.id==='c') return fail('2% adalah potongan berat karung. Itu persen tara.');
        fail('Angka '+w.txt+' belum tepat. Baca lagi kalimatnya.');
      };
    } else if(st===1){
      app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
        const c = +b.dataset.c;
        if(c===2) return next();
        fail(c===0 ? MIS['harga-dari-bruto'] : MIS['persen-jadi-satuan']);
      });
    } else if(st===2){
      app.querySelector('#go').onclick=()=>{
        const n = parseAngka(app.querySelector('#m-n').value), u = parseAngka(app.querySelector('#m-u').value);
        if(n===null || u===null) return fail('Isi kedua kotak dulu, ya.');
        if(!same(n,98)) return fail(same(n,96) ? MIS['persen-jadi-satuan'] : same(n,49) ? 'Itu netto 1 karung. Bu Sari membeli 2 karung.' : same(n,100) ? 'Itu bruto. Kurangi dulu taranya.' : 'Netto 1 karung 49 kg. Berapa untuk 2 karung?');
        if(!same(u,1176000)) return fail(same(u,1200000) ? MIS['harga-dari-bruto'] : 'Bayar = netto × Rp12.000. Coba hitung lagi.');
        next();
      };
    } else if(st===3){
      app.querySelector('#go').onclick=()=>{
        const all = [0,1,2].every(j=>app.querySelector('#ck'+j).checked);
        if(all) next(); else fail('Periksa lagi. Ketiga pernyataan itu benar, lho.');
      };
    } else if(st===4){
      app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
        if(+b.dataset.c===2){ store.misi = true; save(); next(); }
        else fail('Bandingkan: Rp1.200.000 − Rp1.176.000 = Rp24.000. Uangnya lebih atau kurang?');
      });
    } else {
      app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ order.push(+b.dataset.f); draw(); });
      const r = app.querySelector('#reset'); if(r) r.onclick=()=>{ order=[]; draw(); };
      const h = app.querySelector('#home'); if(h) h.onclick=()=>go('home');
    }
  }
  draw();
};

/* ALAT HITUNG */
screens.alat = function(){
  let mode = '%';
  app.innerHTML = '<h2 class="ttl">Alat Hitung</h2><p class="lead">Isi dua nilai. BoxBuster mencari yang ketiga.</p>'+
    '<div class="field"><label for="a-u">Satuan berat</label><div class="inp"><select id="a-u" style="flex:1;border:none;background:transparent;font:700 18px var(--f-body);color:var(--text);padding:12px 14px"><option>kg</option><option>g</option><option>ons</option><option>kuintal</option></select></div></div>'+
    '<div class="field"><label for="a-b" class="k-bruto">Bruto</label><div class="inp"><input id="a-b" inputmode="decimal" autocomplete="off" value="50"><span class="u ua">kg</span></div></div>'+
    '<div class="field"><label for="a-n" class="k-netto">Netto</label><div class="inp"><input id="a-n" inputmode="decimal" autocomplete="off"><span class="u ua">kg</span></div></div>'+
    '<div class="field"><label for="a-t" class="k-tara">Tara</label><div class="seg-toggle"><button id="m-pct" class="on">dalam %</button><button id="m-kg">dalam satuan berat</button></div><div class="inp"><input id="a-t" inputmode="decimal" autocomplete="off" value="2"><span class="u" id="tu">%</span></div></div>'+
    '<div class="row"><button class="btn ghost" id="clr">Kosongkan</button><button class="btn primary" id="go">Hitung</button></div>'+
    '<div id="out"></div><p class="cap">Contoh terisi: beras 50 kg dengan tara 2%.</p>';
  const $ = s=>app.querySelector(s);
  const unit = ()=> $('#a-u').value;
  $('#a-u').onchange = ()=>{ app.querySelectorAll('.ua').forEach(e=>e.textContent=unit()); if(mode==='kg') $('#tu').textContent=unit(); calc(); };
  $('#m-pct').onclick = ()=>{ mode='%'; $('#m-pct').classList.add('on'); $('#m-kg').classList.remove('on'); $('#tu').textContent='%'; calc(); };
  $('#m-kg').onclick = ()=>{ mode='kg'; $('#m-kg').classList.add('on'); $('#m-pct').classList.remove('on'); $('#tu').textContent=unit(); calc(); };
  $('#clr').onclick = ()=>{ ['#a-b','#a-n','#a-t'].forEach(s=>$(s).value=''); $('#out').innerHTML=''; };
  $('#go').onclick = calc;
  function calc(){
    const u = unit();
    let b = parseAngka($('#a-b').value), n = parseAngka($('#a-n').value), t = parseAngka($('#a-t').value), p = null;
    const out = $('#out'); const steps = [];
    const err = m=>{ out.innerHTML = '<div class="fb err"><p class="err-txt">'+esc(m)+'</p></div>'; };
    if([b,n,t].some(v=>v!==null && v<0)) return err('Berat tidak boleh negatif.');
    if(mode==='%'){
      p = t; t = null;
      if(p===null) return err('Isi persen tara dulu.');
      if(p>=100) return err('Persen tara harus kurang dari 100%.');
      if(b!==null){
        t = b*p/100; n = b - t;
        steps.push('Persen tara dihitung dari bruto.','Tara = '+fmt(p)+'% × '+fmt(b)+' = '+fmt(t)+' '+u,'Netto = '+fmt(b)+' − '+fmt(t)+' = '+fmt(n)+' '+u);
      } else if(n!==null){
        b = n/(1-p/100); t = b - n;
        steps.push('Bruto = 100%, jadi netto = '+fmt(100-p)+'% dari bruto.','Bruto = '+fmt(n)+' ÷ '+fmt((100-p)/100)+' = '+fmt(b)+' '+u,'Tara = '+fmt(b)+' − '+fmt(n)+' = '+fmt(t)+' '+u);
      } else return err('Isi bruto atau netto juga.');
    } else {
      const filled = [b,n,t].filter(v=>v!==null).length;
      if(filled<2) return err('Isi dua dari tiga nilai.');
      if(filled===3){
        if(!same(b,n+t)) return err('Tidak cocok: '+fmt(n)+' + '+fmt(t)+' bukan '+fmt(b)+'. Kosongkan salah satu.');
        steps.push('Ketiga nilai sudah cocok: '+fmt(n)+' + '+fmt(t)+' = '+fmt(b)+' '+u);
      } else if(b===null){ b = n+t; steps.push('Bruto adalah keseluruhan, jadi dijumlah.','Bruto = '+fmt(n)+' + '+fmt(t)+' = '+fmt(b)+' '+u); }
      else if(n===null){ n = b-t; steps.push('Netto adalah bagian, jadi dikurangi.','Netto = '+fmt(b)+' − '+fmt(t)+' = '+fmt(n)+' '+u); }
      else { t = b-n; steps.push('Tara adalah bagian, jadi dikurangi.','Tara = '+fmt(b)+' − '+fmt(n)+' = '+fmt(t)+' '+u); }
      p = b>0 ? t/b*100 : 0;
    }
    if(n>b || t>b) return err('Netto atau tara tidak mungkin lebih besar dari bruto.');
    steps.push('Cek: netto '+fmt(n)+' < bruto '+fmt(b)+'. Wajar.');
    out.innerHTML = '<div class="card"><p class="eyebrow">Hasil</p>'+
      barHTML({b,n,t,lb:fmt(b)+' '+u,ln:fmt(n)+' '+u,lt:fmt(t)+' '+u+' ('+fmt(p)+'%)',split:true})+
      '<ol class="steps">'+steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></div>';
  }
  calc();
};

/* ---------- boot ---------- */
try{ window.claude?.hot?.snapshot?.(()=>({screen})); }catch(e){}
function start(data){ screen = 'masuk'; render(); }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
